<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Atividade Formulários</title>

<body>
    <h1>Carros Elétricos</h1>
    <form action="resposta.php" method="post">
        <label for="inome">Nome Completo: </label><br>
        <input type="text" name="nome" id="inome" placeholder="Digite seu nome completo" size="40" required><br><br>

        <label for="imodelo">Modelo de Carro Elétrico Favorito: </label><br>
        <input type="text" name="modelo" id="imodelo" placeholder="Ex: Telsa Model 3" size="40" required><br><br>

        <label for="isenha">Crie Uma senha de Acesso:</label><br>
        <input type="password" name="senha" id="isenha" placeholder="Mínimo 6 caracteres" size="22" required><br><br>
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
